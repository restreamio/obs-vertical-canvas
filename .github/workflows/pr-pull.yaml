name: Pull Request
run-name: ${{ github.event.pull_request.title }} pull request run 🚀
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
    branches: 
      - master
    types: [ opened, synchronize, reopened, labeled ]
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true
jobs:
  #  check-format:
  #    name: Check Formatting 🔍
  #    uses: ./.github/workflows/check-format.yaml
  #    permissions:
  #      contents: read

  build-project:
    name: Build Project 🧱
    # a label event only matters when it is the "sign" label
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'sign'
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read

  remove-sign-label:
    name: Remove sign label 🏷️
    needs: build-project
    if: always() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'sign')
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Remove label 🏷️
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.number }} --repo ${{ github.repository }} --remove-label sign
